name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Как в официальном шаблоне Pages: configure-pages и deploy-pages требуют pages/id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; уже идущий не отменяем, чтобы не оборвать публикацию.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # prepare (git config core.hooksPath) в CI безвреден: внутри checkout это обычный git-репозиторий.
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build # check упал → build упал → публикации нет
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
